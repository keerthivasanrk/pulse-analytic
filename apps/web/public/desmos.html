<!DOCTYPE html>
<html>
<head>
  <script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
    #calculator { width: 100%; height: 100%; }
    #overlay { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 1000; pointer-events: none;}
    h2 { margin: 0 0 10px 0; font-size: 18px; color: #4ade80;}
    p { margin: 0; font-size: 13px; color: #ccc; max-width: 300px; line-height: 1.4;}
  </style>
</head>
<body>
  <div id="overlay">
    <h2>LTTB Downsampling Math</h2>
    <p>To render 1M+ points at 60fps, Pulse uses Largest Triangle Three Buckets (LTTB). This algorithm maximizes the triangle area between the last selected point (A), a candidate (B), and the next bucket's average (C) to preserve visual extrema.</p>
  </div>
  <div id="calculator"></div>
  <script>
    var elt = document.getElementById('calculator');
    var calculator = Desmos.GraphingCalculator(elt, {
      keypad: false,
      expressions: true,
      settingsMenu: false,
      zoomButtons: false
    });

    // We will plot the LTTB triangle concept
    calculator.setExpressions([
      { id: 'folder1', type: 'folder', title: 'Data Series & Buckets' },
      { id: 'f', latex: 'f(x) = \\sin(x) + 0.3\\sin(5x)', color: Desmos.Colors.BLUE, folderId: 'folder1' },
      
      // Bucket boundaries
      { id: 'b1', latex: 'x=2', color: '#555', lineStyle: Desmos.Styles.DASHED, folderId: 'folder1' },
      { id: 'b2', latex: 'x=4', color: '#555', lineStyle: Desmos.Styles.DASHED, folderId: 'folder1' },
      { id: 'b3', latex: 'x=6', color: '#555', lineStyle: Desmos.Styles.DASHED, folderId: 'folder1' },
      
      { id: 'folder2', type: 'folder', title: 'LTTB Triangle Concept' },
      // Point A (Last selected point in Bucket 1)
      { id: 'A', latex: 'A=(1, f(1))', color: Desmos.Colors.RED, label: 'A (Selected)', showLabel: true, folderId: 'folder2' },
      
      // Point C (Average of Bucket 3)
      { id: 'C', latex: 'C=(5, 0.2)', color: Desmos.Colors.GREEN, label: 'C (Next Avg)', showLabel: true, folderId: 'folder2' },
      
      // Point B (Candidate in Bucket 2)
      // We make B interactive along the curve
      { id: 'b_val', latex: 'b = 3', sliderBounds: {min: 2, max: 4}, folderId: 'folder2' },
      { id: 'B', latex: 'B=(b, f(b))', color: Desmos.Colors.ORANGE, label: 'B (Candidate)', showLabel: true, folderId: 'folder2' },
      
      // The Triangle
      { id: 'poly', latex: '\\operatorname{polygon}(A,B,C)', color: Desmos.Colors.PURPLE, fillOpacity: 0.3, folderId: 'folder2' },
      
      // Area formula calculation for display
      { id: 'area', latex: 'Area = 0.5 \\cdot \\left| (A.x - C.x)(B.y - A.y) - (A.x - B.x)(C.y - A.y) \\right|', folderId: 'folder2' }
    ]);
    
    calculator.setMathBounds({
      left: -1,
      right: 8,
      bottom: -2,
      top: 2
    });

    // Auto-animate the slider b
    setTimeout(() => {
      let currentB = 2;
      let dir = 1;
      setInterval(() => {
        currentB += dir * 0.02;
        if (currentB > 4) { currentB = 4; dir = -1; }
        if (currentB < 2) { currentB = 2; dir = 1; }
        calculator.setExpression({ id: 'b_val', latex: 'b = ' + currentB });
      }, 30);
    }, 1000);

  </script>
</body>
</html>
